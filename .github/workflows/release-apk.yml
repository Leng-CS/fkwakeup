name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Debug APK
        run: ./gradlew testDebugUnitTest :app:assembleDebug

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          apk="fkwakeup-${tag}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${apk}"
          sha256sum "${apk}" | tee "${apk}.sha256"
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.assets.outputs.apk }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          release_flags=()
          if [[ "${tag}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${APK}" "${APK}.sha256" --clobber
          elif [[ -f "${notes}" ]]; then
            gh release create "${tag}" "${APK}" "${APK}.sha256" \
              --verify-tag --title "${tag}" --notes-file "${notes}" "${release_flags[@]}"
          else
            gh release create "${tag}" "${APK}" "${APK}.sha256" \
              --verify-tag --title "${tag}" --generate-notes "${release_flags[@]}"
          fi
